<!doctype html>

<style>

@font-face{font-family:P;font-weight:800;src:url(fonts/pretendard-800.woff2)}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#fff;font-family:P,sans-serif;color:#111;position:relative;word-break:keep-all}
.top{position:absolute;left:0;right:0;top:0;height:14px;background:#111}
.grid{position:absolute;inset:14px 0 0 0;background-image:radial-gradient(#d9d9d9 1.6px,transparent 1.7px);background-size:28px 28px;opacity:.7}
.left{position:absolute;left:64px;top:70px;width:600px}
.brand{display:flex;align-items:center;gap:14px}
.brand .word{font-weight:800;font-size:34px;letter-spacing:-.045em}
.brand .div{width:3px;height:36px;background:#111}
.brand .sub{display:flex;flex-direction:column;gap:5px;line-height:1}
.brand .sub b{font-weight:800;font-size:14px;letter-spacing:.2em}
.brand .sub b+b{color:#e1262c}
h1{font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-.05em;margin:46px 0 30px}
h1 em{font-style:normal;color:#e1262c}
.slab{display:inline-flex;border:4px solid #111;align-items:stretch;background:#fff}
.slab b{background:#111;color:#fff;font-size:20px;letter-spacing:.12em;padding:14px 18px;display:flex;align-items:center}
.slab span{font-weight:800;font-size:23px;padding:12px 20px;display:flex;align-items:center}
.foot{position:absolute;left:64px;bottom:42px;font-weight:700;font-size:18px;color:#4d4d4d;letter-spacing:.02em}
.foot i{font-style:normal;background:#f2f2f2;color:#111;padding:3px 10px;font-family:ui-monospace,Menlo,monospace;font-size:17px}
svg.bot{position:absolute;right:30px;top:40px;width:520px;height:560px}
